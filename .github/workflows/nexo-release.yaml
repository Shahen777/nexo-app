name: nexo-release

# Public downloads. A version tag publishes a stable release; a manual run
# publishes a prerelease so the files can be checked before the first tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (empty: v<pubspec>-ci.<run id>, prerelease)'
        required: false
        type: string

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE != '' }}
      NEXO_MAC_UNIVERSAL: ${{ matrix.universal || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            artifact: nexo-android
          - platform: macos
            os: macos-15-intel
            universal: '1'
            artifact: nexo-macos
          - platform: windows
            os: windows-2022
            artifact: nexo-windows
          - platform: linux
            os: ubuntu-22.04
            artifact: nexo-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android signing
        if: matrix.platform == 'android' && env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          echo "$KEYSTORE" | base64 --decode > android/app/keystore.jks
          {
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "storePassword=${{ secrets.STORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } >> android/local.properties

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Gradle
        if: matrix.platform == 'android'
        uses: gradle/actions/setup-gradle@v6

      - name: Enable git long paths (Windows)
        if: matrix.platform == 'windows'
        run: git config --global core.longpaths true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Xcode
        if: matrix.platform == 'macos'
        run: |
          latest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Install macOS Rust targets
        if: matrix.platform == 'macos'
        working-directory: plugins/rust_api/rust
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Setup NDK
        if: matrix.platform == 'android'
        uses: nttld/setup-ndk@v1
        id: build-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Enable universal macOS core
        if: matrix.platform == 'macos' && matrix.universal
        run: |
          python3 - <<'PY'
          p = 'pubspec.yaml'
          s = open(p).read()
          s = s.replace('    setup:\n      build_assets: true\n',
                        '    setup:\n      build_assets: true\n      macos_universal: true\n', 1)
          assert 'macos_universal: true' in s
          open(p, 'w').write(s)
          PY

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Fetch CA certificates
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | { command -v sha256sum >/dev/null && sha256sum -c - || shasum -a 256 -c -; }

      - name: Build
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.build-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          dart setup.dart ${{ matrix.platform }} --env stable -v
          if [[ '${{ matrix.platform }}' == android ]]; then
            mkdir -p "$RUNNER_TEMP/apks"
            cp -a dist/*.apk "$RUNNER_TEMP/apks/"
            dart setup.dart android --env stable --universal-apk -v
            cp -an dist/*.apk "$RUNNER_TEMP/apks/" || cp -a dist/*.apk "$RUNNER_TEMP/apks/"
            rm -rf dist
            mkdir dist
            cp -a "$RUNNER_TEMP/apks/." dist/
          fi

      - name: Verify universal macOS app
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          dmgs=(./dist/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ] || [ ! -f "${dmgs[0]}" ]; then
            echo 'Expected exactly one DMG in dist' >&2
            exit 1
          fi
          mountpoint=$(mktemp -d)
          mounted=0
          cleanup() {
            if [ "$mounted" -eq 1 ]; then hdiutil detach "$mountpoint"; fi
            rmdir "$mountpoint"
          }
          trap cleanup EXIT
          hdiutil attach "${dmgs[0]}" -readonly -nobrowse -mountpoint "$mountpoint"
          mounted=1
          app="$mountpoint/Nexo.app"
          check_slices() {
            local binary="$1" slices arch
            slices=$(lipo -archs "$binary")
            echo "$binary: $slices"
            for arch in arm64 x86_64; do
              case " $slices " in
                *" $arch "*) ;;
                *) echo "Missing $arch in $binary" >&2; return 1 ;;
              esac
            done
          }
          check_slices "$app/Contents/MacOS/Nexo"
          check_slices "$app/Contents/MacOS/FlClashCore"
          rust_library=$(find "$app/Contents/Frameworks" -path '*rust_api.framework/*' -name rust_api -type f -print -quit)
          if [ -z "$rust_library" ]; then
            echo 'Rust native asset not found in the app' >&2
            exit 1
          fi
          check_slices "$rust_library"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ./dist
          retention-days: 14

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: nexo-*
          path: dist
          merge-multiple: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Skip native build hooks
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml

      - name: Resolve version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
            prerelease=false
          else
            pubspec_version=$(sed -n 's/^version: *//p' pubspec.yaml | cut -d+ -f1)
            if [[ -n "${INPUT_TAG}" ]]; then
              tag="${INPUT_TAG}"
            else
              tag="v${pubspec_version}-ci.${GITHUB_RUN_ID}"
            fi
            version="$pubspec_version"
            prerelease=true
          fi
          version="${version%%-*}"
          version="${version%%+*}"
          echo "tag=$tag" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_ENV"
          echo "prerelease=$prerelease" >> "$GITHUB_ENV"

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          if ! dart run tool/changelog.dart render release --tag "$tag" --out release.md; then
            printf 'Nexo %s\n' "$version" > release.md
          fi
          sed "s|VERSION|$version|g" .github/release_template.md >> release.md

      - name: Write latest.json
        run: |
          dart run tool/release_manifest.dart \
            --version "$version" \
            --tag "$tag" \
            --notes release.md \
            --dist dist \
            --repository Shahen777/nexo-app \
            --out dist/latest.json
          find dist -maxdepth 1 -type f ! -name SHA256SUMS -print0 | xargs -0 sha256sum > SHA256SUMS
          mv SHA256SUMS dist/SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.tag }}
          name: ${{ env.tag }}
          prerelease: ${{ env.prerelease == 'true' }}
          body_path: release.md
          files: dist/*
