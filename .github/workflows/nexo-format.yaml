name: nexo-format

# Formats Dart code in the cloud (no Dart SDK on the maintainer's Mac) and commits the result.
on:
  workflow_dispatch:
    inputs:
      generate_localizations:
        description: Regenerate Dart localizations from source ARB files
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
      - run: flutter pub get
      - name: Generate localizations
        if: inputs.generate_localizations
        run: |
          set -euo pipefail
          cp pubspec.yaml /tmp/nexo-format-pubspec.yaml
          trap 'cp /tmp/nexo-format-pubspec.yaml pubspec.yaml' EXIT
          yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml
          dart run intl_utils:generate
      - run: dart format lib test tool plugins setup.dart
      - name: Commit
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "style: dart format"
          git push
