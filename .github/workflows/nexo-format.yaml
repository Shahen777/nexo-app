name: nexo-format

# Formats Dart code in the cloud (no Dart SDK on the maintainer's Mac) and commits the result.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
      - run: flutter pub get
      - run: dart format lib test tool plugins setup.dart
      - name: Commit
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "style: dart format"
          git push
